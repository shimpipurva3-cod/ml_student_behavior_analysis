<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Online Learning AI - Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!--Custom CSS-->
        <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    </head>
    <body>
        <div class="container-fluid login-container">
        <div class="row min-vh-100">
            <!--Left side-->
            <div class="col-md-6 left-section">
            <div class="content">
                <h1>Student Behavior Analysis System</h1>
                <h3>Analyze. Understand. Improve.</h3>
                <p>
                    System that analyzes college students' online learning 
                    behavior and provides meaningful insights.
                </p>
            </div>
            </div>
            <!--Right Side-->
            <div class="col-md-6 right-section">
                <div class="login-box">
                    <h2>Welcome Back!</h2>
                    <p class="text-muted">
                        Login to view your learning analytics
                    </p>
                    <form method="POST" action="/login">
                        <!--Email-->
                        <div class="mb-3">
                            <label class="form-label"> Email </label>
                            <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                            >
                        </div>
                        <!--Password-->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                            >
                        </div>
                        <!--Remember-->
                        <div class="form-check mb-3">
                            <input
                            class="form-check-input"
                            type="checkbox"
                            id="remember"
                            >
                            <label 
                            class="form-check-label"
                            for="remember"
                            >
                        Remember me
                    </label>
                        </div>
                        <!--Login Button-->
                        <button 
                        type="submit"
                        class="btn login-btn w-100"
                        >
                    Login
                </button>
                    </form>
                    <div class="admin-link">
                        <a href="{{ url_for('admin_login') }}">
                            👨‍💼 Admin Login
                        </a>
                    </div>
                    <!--Register-->
                    <p class="register-text">
                        Don't have an account?
                        <a href="/register">
                            Create Account
                        </a>
                    </p>
                </div>
            </div>
    </body>
</html>
