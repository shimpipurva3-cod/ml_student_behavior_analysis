<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Learning Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3 class="mb-3">📊 Enter Learning Data</h3>
            <form action="{{ url_for('learning_data') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Study Hours</label>
                    <input type="number" step="0.1" name="study_hours" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sleep Hours</label>
                    <input type="number" step="0.1" name="sleep_hours" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Screen Time (Hours)</label>
                    <input type="number" step="0.1" name="screen_time" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Water Intake (Litres)</label>
                    <input type="number" step="0.1" name="water_intake" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Marks / Score</label>
                    <input type="number" step="0.1" name="marks" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit Data</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
